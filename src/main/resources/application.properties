spring.application.name=room-booking-system
server.port=8086

# Profile mặc định. Đổi bằng biến môi trường SPRING_PROFILES_ACTIVE (dev | prod | test)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== MySQL (localhost:3306, root, không mật khẩu) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/room_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.format_sql=true

# ===== Jackson =====
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===== Upload file =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20GB
spring.servlet.multipart.max-request-size=100GB

# ===== JWT (access token 15 phút) =====
app.jwt.secret=${JWT_SECRET:room-booking-system-super-secret-key-2026-change-me}
app.jwt.access-token-expiration-ms=900000
app.jwt.issuer=room-booking-system

# ===== Refresh token / đặt lại mật khẩu / BCrypt =====
app.refresh-token.expiration-days=7
app.password-reset.expiration-minutes=15
app.security.bcrypt-strength=10

# ===== CORS: React (3000) và Vite (5173) =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ===== Địa chỉ FE (dùng tạo link đặt lại mật khẩu trong email) =====
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ===== Email (false: chỉ ghi log nội dung, không gửi thật) =====
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@roombooking.local}
spring.thymeleaf.cache=true

# ===== Swagger: http://localhost:8086/swagger-ui.html =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method

# ===== Log =====
logging.level.root=INFO
