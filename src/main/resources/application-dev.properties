# Tự tạo / cập nhật bảng theo entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.example.roombooking=DEBUG
logging.level.org.springframework.security=INFO

# Sửa template email không cần khởi động lại
spring.thymeleaf.cache=false

# Dev: mật khẩu rỗng nên cho phép đặt lại qua log, không gửi mail thật
app.mail.enabled=false