# Không tự đổi cấu trúc bảng trên môi trường thật
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# BẮT BUỘC cấu hình bằng biến môi trường, không có giá trị mặc định để tránh chạy nhầm với mật khẩu rỗng
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS}
app.frontend-url=${FRONTEND_URL}

# Tắt Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Gửi email thật
app.mail.enabled=true
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Ẩn chi tiết lỗi, giảm log
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
logging.level.root=WARN
logging.level.com.example.roombooking=INFO
